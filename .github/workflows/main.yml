
name: M3U8 Live Scanner

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requests
        run: pip install requests

      - name: Scan M3U8
        run: python scanner.py

      - name: Update JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "Update live links"
          git push
